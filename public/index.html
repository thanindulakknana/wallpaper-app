<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallpaper Finder</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        input { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; min-width: 200px; background: #2a2a2a; color: white; }
        input::placeholder { color: #888; }
        button { padding: 15px 30px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #45a049; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; text-align: center; position: relative; }
        .card img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; transition: transform 0.2s; }
        .card img:hover { transform: scale(1.02); }
        .card p { padding: 10px; font-size: 14px; color: #aaa; margin: 0; }
        .card .download-btn {
            display: inline-block;
            margin: 10px 0 15px 0;
            padding: 8px 20px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .card .download-btn:hover { background: #005bb5; }
        .resolution-badge { background: #333; padding: 5px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin-top: 5px; }
        .status { margin-top: 20px; text-align: center; }
        .resolution-info { background: #1a1a2e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #4CAF50; }
        .resolution-info strong { color: #4CAF50; }
        .loading { color: #ffa500; }
        .error { color: #ff4444; }
        .success { color: #4CAF50; }
        .manual-link { color: #0070f3; cursor: pointer; text-decoration: underline; }
        .match-badge { 
            display: inline-block; 
            padding: 2px 10px; 
            border-radius: 10px; 
            font-size: 11px; 
            margin-left: 5px;
        }
        .match-excellent { background: #1b5e20; color: #a5d6a7; }
        .match-good { background: #e65100; color: #ffcc80; }
        .match-fair { background: #b71c1c; color: #ffcdd2; }
        .search-examples {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }
        .search-examples span {
            color: #0070f3;
            cursor: pointer;
            text-decoration: underline;
        }
        .search-examples span:hover {
            color: #005bb5;
        }
        .resolution-warning {
            background: #2a1a1a;
            border-left: 4px solid #ff4444;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        .match-info {
            font-size: 12px;
            margin-top: 5px;
            color: #888;
        }
        .tags {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
            word-wrap: break-word;
            max-height: 30px;
            overflow: hidden;
        }
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }
        .no-results h3 { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Smart Wallpaper Finder</h1>
        
        <div class="resolution-info">
            📱 <strong>Your Screen Resolution:</strong> <span id="detectedResolution">Loading...</span>
            <br />
            <small>If this is incorrect, <span class="manual-link" onclick="manualResolution()">click here to set it manually</span></small>
            <div id="resolutionWarning" class="resolution-warning">
                ⚠️ Warning: Your detected resolution may be incorrect. Please use the manual override above.
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search wallpapers... (e.g., nissan gtr r34)" />
            <button onclick="performSearch()">🔍 Search</button>
        </div>

        <div class="search-examples">
            Try: <span onclick="setSearch('nature')">🌿 Nature</span> | 
            <span onclick="setSearch('city')">🏙️ City</span> | 
            <span onclick="setSearch('car')">🚗 Car</span> | 
            <span onclick="setSearch('abstract')">🎨 Abstract</span> | 
            <span onclick="setSearch('space')">🚀 Space</span> |
            <span onclick="setSearch('nissan skyline r34 gtr')">🏎️ Nissan GTR</span>
        </div>

        <div id="results" class="grid"></div>
        <p id="statusMessage" class="status"></p>
    </div>

    <script>
        console.log("✅ Smart Wallpaper Finder loaded");

        // ============================================
        // SCREEN DETECTION (FIXED)
        // ============================================
        function detectScreen() {
            console.log("📱 Detecting screen...");
            
            const screenWidth = screen.width;
            const screenHeight = screen.height;
            
            // Use the actual screen resolution (no scaling adjustments)
            // This gets the TRUE physical resolution
            let effectiveWidth = screenWidth;
            let effectiveHeight = screenHeight;
            
            // If Windows scaling is causing issues, let user fix it manually
            // Show warning if resolution seems unusual
            const commonResolutions = [
                [1920, 1080], [1600, 900], [1366, 768], [1280, 720],
                [3840, 2160], [2560, 1440], [3440, 1440], [1680, 1050]
            ];
            
            let isCommon = false;
            for (let i = 0; i < commonResolutions.length; i++) {
                if (screenWidth === commonResolutions[i][0] && screenHeight === commonResolutions[i][1]) {
                    isCommon = true;
                    break;
                }
            }
            
            if (!isCommon) {
                document.getElementById('resolutionWarning').style.display = 'block';
                document.getElementById('resolutionWarning').innerHTML = 
                    `⚠️ Unusual resolution detected (${screenWidth}×${screenHeight}). Please use the manual override above if this is incorrect.`;
            }
            
            // Store in global variables
            window.SCREEN_WIDTH = effectiveWidth;
            window.SCREEN_HEIGHT = effectiveHeight;
            window.RESOLUTION_OVERRIDE = false;
            
            // Update display
            document.getElementById('detectedResolution').innerHTML = 
                `<strong>${effectiveWidth} × ${effectiveHeight}</strong> pixels`;
            
            console.log(`✅ Screen detected: ${effectiveWidth}×${effectiveHeight}`);
            return { width: effectiveWidth, height: effectiveHeight };
        }

        // ============================================
        // MANUAL RESOLUTION OVERRIDE
        // ============================================
        function manualResolution() {
            console.log("📝 Manual override triggered");
            
            const width = prompt("Enter your actual screen width (e.g., 1600):");
            if (!width) return;
            const height = prompt("Enter your actual screen height (e.g., 900):");
            if (!height) return;
            
            const w = parseInt(width);
            const h = parseInt(height);
            
            if (isNaN(w) || isNaN(h) || w < 1 || h < 1) {
                alert("❌ Please enter valid numbers!");
                return;
            }
            
            window.SCREEN_WIDTH = w;
            window.SCREEN_HEIGHT = h;
            window.RESOLUTION_OVERRIDE = true;
            
            document.getElementById('detectedResolution').innerHTML = 
                `<strong>${w} × ${h}</strong> <span style="color:#ffa500;">(Manual override)</span>`;
            document.getElementById('resolutionWarning').style.display = 'none';
            
            console.log(`✅ Manual override: ${w}×${h}`);
            
            const searchInput = document.getElementById('searchInput');
            if (searchInput.value.trim()) {
                performSearch();
            } else {
                searchInput.focus();
                searchInput.placeholder = "Now search for wallpapers!";
            }
        }

        // ============================================
        // SET SEARCH
        // ============================================
        function setSearch(term) {
            document.getElementById('searchInput').value = term;
            performSearch();
        }

        // ============================================
        // SEARCH FUNCTION (IMPROVED)
        // ============================================
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Please enter a search term!');
                return;
            }

            console.log(`🔍 Searching for: "${query}"`);

            const resultsContainer = document.getElementById('results');
            const statusMsg = document.getElementById('statusMessage');
            
            resultsContainer.innerHTML = '';
            statusMsg.innerHTML = '⏳ Searching for wallpapers...';
            statusMsg.className = 'status loading';

            try {
                const width = window.SCREEN_WIDTH || screen.width;
                const height = window.SCREEN_HEIGHT || screen.height;
                
                console.log(`📐 Using resolution: ${width}×${height}`);

                const response = await fetch(
                    `/api/search?query=${encodeURIComponent(query)}&screenWidth=${width}&screenHeight=${height}`
                );
                const data = await response.json();

                if (data.error) {
                    statusMsg.innerHTML = '❌ ' + data.error;
                    statusMsg.className = 'status error';
                    return;
                }

                if (!data.wallpapers || data.wallpapers.length === 0) {
                    statusMsg.innerHTML = `😕 No wallpapers found for "${query}". Try a broader search.`;
                    statusMsg.className = 'status error';
                    return;
                }

                statusMsg.innerHTML = `✅ Found ${data.wallpapers.length} wallpapers for "${query}"`;
                statusMsg.className = 'status success';

                // Display results
                data.wallpapers.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // ============================================
                    // FIXED: Match quality based on ASPECT RATIO
                    // ============================================
                    const userAspectRatio = width / height;
                    const imgAspectRatio = img.imageWidth / img.imageHeight;
                    const aspectDiff = Math.abs(imgAspectRatio - userAspectRatio) / userAspectRatio;
                    
                    // Resolution difference for display only
                    const widthDiff = Math.abs(img.imageWidth - width);
                    const heightDiff = Math.abs(img.imageHeight - height);
                    
                    let matchLabel = '';
                    let matchClass = '';
                    
                    // Score based on aspect ratio match (most important)
                    if (aspectDiff < 0.01) {
                        matchLabel = '⭐ Perfect 16:9!';
                        matchClass = 'match-excellent';
                    } else if (aspectDiff < 0.03) {
                        matchLabel = '✅ Very Close';
                        matchClass = 'match-excellent';
                    } else if (aspectDiff < 0.05) {
                        matchLabel = '👍 Good Match';
                        matchClass = 'match-good';
                    } else if (aspectDiff < 0.10) {
                        matchLabel = '📏 Acceptable';
                        matchClass = 'match-fair';
                    } else {
                        matchLabel = '❌ Wrong Ratio';
                        matchClass = 'match-fair';
                    }
                    
                    // Show tags (what the image is actually tagged as)
                    const tags = img.tags ? img.tags.split(', ').slice(0, 5).join(', ') : 'No tags';
                    
                    card.innerHTML = `
                        <img src="${img.webformatURL}" alt="${img.tags}" loading="lazy" 
                             onclick="window.open('${img.webformatURL}', '_blank')" 
                             title="Click to open full size" />
                        <p>
                            <span class="resolution-badge">📐 ${img.imageWidth} × ${img.imageHeight}</span>
                            <span class="match-badge ${matchClass}">${matchLabel}</span>
                            <br />❤️ ${img.likes} | 👁️ ${img.views} | ⬇️ ${img.downloads || 0}
                            <br /><span class="match-info">Tags: ${tags}</span>
                        </p>
                        <a href="${img.webformatURL}" download target="_blank" class="download-btn">⬇️ Download Wallpaper</a>
                    `;
                    resultsContainer.appendChild(card);
                });

                console.log(`✅ Displayed ${data.wallpapers.length} results`);

            } catch (error) {
                console.error('❌ Search error:', error);
                statusMsg.innerHTML = '❌ Connection error. Please try again.';
                statusMsg.className = 'status error';
            }
        }

        // ============================================
        // RUN ON PAGE LOAD
        // ============================================
        window.addEventListener('DOMContentLoaded', function() {
            console.log("📄 Page loaded");
            detectScreen();
        });

        // Enter key support
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                console.log("⌨️ Enter pressed");
                performSearch();
            }
        });

        console.log("✅ All scripts initialized");
    </script>
</body>
</html>
