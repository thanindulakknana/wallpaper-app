<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallpaper Finder</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; }
        button { padding: 15px 30px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card p { padding: 10px; font-size: 14px; color: #aaa; }
        .resolution-badge { background: #333; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .status { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Smart Wallpaper Finder</h1>
        <p>Detected Screen: <span id="detectedResolution">Loading...</span></p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="e.g., mountains, sunset, abstract, cars..." />
            <button onclick="performSearch()">🔍 Search</button>
        </div>

        <div id="results" class="grid"></div>
        <p id="statusMessage" class="status"></p>
    </div>

    <script>
        // Detect the user's true screen resolution
        const screenWidth = screen.width;
        const screenHeight = screen.height;
        const pixelRatio = window.devicePixelRatio || 1;
        const effectiveWidth = Math.round(screenWidth * pixelRatio);
        const effectiveHeight = Math.round(screenHeight * pixelRatio);

        document.getElementById('detectedResolution').innerText = 
            `${effectiveWidth} x ${effectiveHeight} (Physical: ${screenWidth}x${screenHeight}, DPR: ${pixelRatio})`;

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Please enter a search term!');
                return;
            }

            const resultsContainer = document.getElementById('results');
            const statusMsg = document.getElementById('statusMessage');
            resultsContainer.innerHTML = '';
            statusMsg.innerText = '⏳ Searching for wallpapers that fit your screen...';

            try {
                const response = await fetch(
                    `/api/search?query=${encodeURIComponent(query)}&screenWidth=${effectiveWidth}&screenHeight=${effectiveHeight}`
                );
                const data = await response.json();

                if (data.error) {
                    statusMsg.innerText = '❌ Error: ' + data.error;
                    return;
                }

                if (data.wallpapers.length === 0) {
                    statusMsg.innerText = `😕 No wallpapers found that are larger than ${effectiveWidth}x${effectiveHeight}. Try a broader search.`;
                    return;
                }

                statusMsg.innerText = `✅ Found ${data.total} matching wallpapers. Showing ${data.wallpapers.length}.`;

                data.wallpapers.forEach(img => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${img.webformatURL}" alt="${img.tags}" loading="lazy" />
                        <p>
                            <span class="resolution-badge">${img.imageWidth} x ${img.imageHeight}</span>
                            <br />❤️ ${img.likes} | 👁️ ${img.views}
                        </p>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                statusMsg.innerText = '❌ Cannot connect to server. Make sure it is running.';
                console.error(error);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
